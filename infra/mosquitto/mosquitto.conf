# Mosquitto 2 for a FireX site: mutual TLS only, identity from the client
# certificate, topic access from ./acl. Certificates are created by
# firex-server on first start in its data volume, mounted here at /firex.

per_listener_settings false
allow_anonymous false

listener 8883
protocol mqtt
cafile /firex/pki/ca.crt
certfile /firex/pki/broker.crt
keyfile /firex/pki/broker.key
# Units removed from the site are revoked here (firex-server writes it; an empty list at first start).
# Mosquitto reads it when it starts: restart the broker after removing a unit (infra/README.md).
crlfile /firex/pki/crl.pem
tls_version tlsv1.2
require_certificate true
# A client's username is the CN of its certificate: a node's device_id, or firex-server.
use_identity_as_username true

acl_file /mosquitto/config/acl

# Nodes resynchronise from their own flash on every connect (docs/transport.md),
# so the broker keeps no state of its own.
persistence false

# Incident photos travel as single messages; allow up to 2 MiB.
max_packet_size 2097152

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
