# Afternoon sun through a window, chopped by leaves moving outside. Steady
# sunlight sits outside the flame scorer's 1-15 Hz band; moving shadows do not,
# so the flame score bursts for a few seconds at a time. Each burst is shorter
# than the ELEVATED dwell and far under the flame-alone score. Made-up numbers.
name: sunlight on the flame sensor
description: Short in-band flame bursts from moving shadows, never held. Must stay NORMAL.
duration_s: 240
interval_s: 2
warmup_s: 0

channels:
  flame:
    - { until: 20,  from: 0.20, to: 0.25 }
    - { until: 21,  to: 0.68 }
    - { until: 24,  to: 0.68 }
    - { until: 25,  to: 0.25 }
    - { until: 60,  to: 0.30 }
    - { until: 61,  to: 0.70 }
    - { until: 64,  to: 0.66 }
    - { until: 65,  to: 0.22 }
    - { until: 100, to: 0.28 }
    - { until: 101, to: 0.69 }
    - { until: 104, to: 0.69 }
    - { until: 105, to: 0.25 }
    - { until: 240, to: 0.20 }
  flame_noise: 0.03
  heat: 0.12       # the sun warms the enclosure a little
  humidity: 0.35
  gas: 0.05
  smoke: 0.06

expect: [NORMAL]

trial: { class: nuisance, name: sunlight-window, start_s: 10, end_s: 120 }
