# A mattress smouldering from a dropped cigarette: smoke and pyrolysis gases
# for minutes before any flame or real heat. Gas and smoke agree long before
# heat does, so this is the case against switching fx_mos_pair off: with it
# off, CRITICAL waits for the heat channel. Made-up numbers.
name: smouldering fire
description: Smoke then gas climb over five minutes, heat follows late. Should reach CRITICAL.
duration_s: 720
interval_s: 2
warmup_s: 0

channels:
  smoke:
    - { until: 60,  from: 0.05, to: 0.12 }
    - { until: 300, from: 0.12, to: 0.72 }
    - { until: 720, from: 0.72, to: 0.88 }
  smoke_noise: 0.02
  gas:
    - { until: 90,  from: 0.05, to: 0.10 }
    - { until: 330, from: 0.10, to: 0.68 }
    - { until: 720, from: 0.68, to: 0.80 }
  gas_noise: 0.02
  heat:
    - { until: 420, from: 0.05, to: 0.20 }
    - { until: 540, from: 0.20, to: 0.70 }
    - { until: 720, from: 0.70, to: 0.85 }
  humidity: 0.40
  flame: 0.0

expect: [NORMAL, ELEVATED, CRITICAL]

trial: { class: hazard, name: smoulder-mattress, start_s: 0, end_s: 720 }
